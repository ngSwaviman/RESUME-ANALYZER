# Render Blueprint — one Node web service that builds the React client and
# serves it from Express, so the UI and the API share a single origin.
#
# Secrets (MONGO_URI, ADMIN_PASSWORD) are intentionally not stored here:
# Render asks for them once when the blueprint is applied.
services:
  - type: web
    name: resumerank
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        value: swavi@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAX_RESUME_SIZE_MB
        value: 5
